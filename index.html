<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>애니멀 브롤 통계</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--bg:#f2f4f6;--card:#fff;--ink:#191f28;--ink2:#4e5968;--ink3:#8b95a1;--line:#eef0f2;--blue:#3182f6;--blueSoft:#e8f3ff;--red:#f04452;--green:#16a34a;--bar:#d6e6fd}
@media (prefers-color-scheme:dark){:root{--bg:#101216;--card:#1b1e24;--ink:#f2f4f6;--ink2:#b0b8c1;--ink3:#6b7684;--line:#2a2e36;--blueSoft:#18314f;--bar:#1f3b61}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard',-apple-system,system-ui,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:880px;margin:0 auto;padding:0 16px 80px}
header{padding:22px 0 10px}
h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.03em}
.sub{font-size:13px;color:var(--ink3);margin-top:4px;font-weight:500}
.card{background:var(--card);border-radius:20px;padding:16px;margin-top:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input[type=number]{height:36px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:0 10px;font:600 13px 'Pretendard',sans-serif}
label{font-size:13px;color:var(--ink2);font-weight:600;display:flex;gap:6px;align-items:center}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 0 2px;position:sticky;top:0;background:var(--bg);z-index:5}
.tab{border:0;background:var(--card);color:var(--ink2);border-radius:99px;padding:9px 16px;font:700 14px 'Pretendard',sans-serif;white-space:nowrap;cursor:pointer}
.tab.on{background:var(--blue);color:#fff}
.btn{border:0;background:var(--blue);color:#fff;border-radius:12px;height:36px;padding:0 14px;font:700 13px 'Pretendard',sans-serif;cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kpi{background:var(--bg);border-radius:14px;padding:12px}
.kpi b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em}
.kpi span{font-size:12px;color:var(--ink3);font-weight:600}
h2{margin:0 0 10px;font-size:16px;font-weight:800;letter-spacing:-.02em}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:700;color:var(--ink3);text-align:right;padding:8px 8px;white-space:nowrap;cursor:pointer;user-select:none}
th:first-child,td:first-child{text-align:left}
td{padding:9px 8px;border-top:1px solid var(--line);text-align:right;white-space:nowrap;font-weight:600}
td.nm{font-weight:700}
.bar{position:relative;min-width:84px;height:22px;border-radius:7px;background:var(--bg);overflow:hidden;text-align:right}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--bar)}
.bar span{position:relative;padding:0 6px;line-height:22px;font-weight:700}
.low{opacity:.45}
.win{color:var(--green)}.lose{color:var(--red)}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;background:var(--blueSoft);color:var(--blue);margin-left:6px}
.note{font-size:12px;color:var(--ink3);line-height:1.6;margin-top:8px}
.empty{padding:36px 0;text-align:center;color:var(--ink3);font-weight:600}
.deck{white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>🐾 애니멀 브롤 통계</h1><div class="sub" id="meta">불러오는 중…</div></header>
  <div class="card"><div class="row">
    <select id="fVer"></select>
    <select id="fMode"><option value="all">전체</option><option value="s">스테이지</option><option value="a">아레나</option></select>
    <label>최소 표본 <input id="fMin" type="number" min="1" value="10" style="width:64px"></label>
    <label><input id="fDbg" type="checkbox" checked> 디버그 기록 제외</label>
    <select id="fLimit"><option>500</option><option selected>1000</option><option>2000</option></select>
    <button class="btn" id="reload">새로고침</button>
  </div>
  <div class="note" id="readNote"></div></div>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
  <div class="note" style="text-align:center;margin-top:24px">승률은 강한 유저가 좋은 스킬을 더 많이 쓰는 영향을 받아요. 표본이 적은 항목은 흐리게 표시돼요. 기록은 게임이 보낸 값이라 조작이 섞일 수 있어요.</div>
</div>

<script type="module">
const NAMES = {"f": [["dog", "🐶", "강아지", "n"], ["rabbit", "🐰", "토끼", "n"], ["fox", "🦊", "여우", "r"], ["frog", "🐸", "개구리", "r"], ["wolf", "🐺", "늑대", "e"], ["panda", "🐼", "판다", "e"], ["tiger", "🐯", "호랑이", "m"], ["bear", "🐻", "곰", "m"], ["lion", "🦁", "사자", "l"], ["eagle", "🦅", "독수리", "l"], ["dragon", "🐲", "용", "t"], ["unicorn", "🦄", "유니콘", "t"]], "s": [["fire", "🔥", "불꽃", "n"], ["smash", "👊", "강타", "n"], ["wind", "🌪️", "회오리", "n"], ["firstaid", "🩹", "응급처치", "n"], ["stone", "🪨", "돌팔매", "n"], ["ice", "❄️", "얼음창", "r"], ["vamp", "🩸", "흡혈", "r"], ["poison", "☠️", "맹독", "r"], ["rush", "💨", "질풍참", "r"], ["barrier", "🛡️", "보호막", "r"], ["bolt", "⚡", "번개", "e"], ["bomb", "💥", "폭발", "e"], ["volley", "🏹", "화살비", "e"], ["swamp", "🕸️", "끈끈이 늪", "e"], ["rage", "😡", "광폭화", "e"], ["inferno", "🌋", "불바다", "m"], ["hole", "🌀", "블랙홀", "m"], ["snipe", "🎯", "저격", "m"], ["storm", "⛈️", "뇌우", "m"], ["bloodlust", "🧛", "혈귀화", "m"], ["meteor", "☄️", "운석", "l"], ["bladedance", "🗡️", "검무", "l"], ["wave", "🌊", "해일", "l"], ["timestop", "⏳", "시간 정지", "l"], ["sanctuary", "✨", "성역", "l"], ["nova", "🌌", "초신성 폭발", "t"], ["moonblade", "🌙", "기습", "t"], ["prison", "🕳️", "차원 감옥", "t"], ["eclipse", "☀️", "일식", "t"], ["shower", "🌠", "유성우", "t"]], "evo": {"fire": {"a": "잿더미", "b": "불똥"}, "smash": {"a": "약점 파쇄", "b": "반동 강타"}, "wind": {"a": "모래 바람", "b": "소용돌이 방패"}, "firstaid": {"a": "해독 붕대", "b": "비상 탈출"}, "stone": {"a": "입막음 돌", "b": "뜀박질 돌"}, "ice": {"a": "설상가상", "b": "냉기"}, "vamp": {"a": "빈혈", "b": "저주 받은 송곳니"}, "poison": {"a": "신경독", "b": "부식독"}, "rush": {"a": "가속도", "b": "점멸"}, "barrier": {"a": "가시 방벽", "b": "수호자"}, "bolt": {"a": "피뢰침", "b": "연쇄 번개"}, "bomb": {"a": "대폭발", "b": "지뢰 매설"}, "volley": {"a": "올가미 화살", "b": "다다익선"}, "swamp": {"a": "독기 늪", "b": "구속"}, "rage": {"a": "위협의 포효", "b": "가시갑옷"}, "inferno": {"a": "불의 가호", "b": "유황 연기"}, "hole": {"a": "사건의 지평선", "b": "상대론"}, "snipe": {"a": "헤드샷", "b": "퀵드로우"}, "storm": {"a": "피뢰침", "b": "감전 폭풍"}, "bloodlust": {"a": "사냥의 표식", "b": "핏빛 질주"}, "meteor": {"a": "크레이터", "b": "쌍둥이 운석"}, "bladedance": {"a": "피의 검무", "b": "α"}, "wave": {"a": "두 번째 파도", "b": "서핑"}, "timestop": {"a": "시간 도둑", "b": "되감기"}, "sanctuary": {"a": "징벌의 성역", "b": "정화의 성역"}, "nova": {"a": "성운", "b": "빅뱅"}, "moonblade": {"a": "그림자 처형", "b": "잠복근무"}, "prison": {"a": "공허의 속삭임", "b": "균열"}, "eclipse": {"a": "프리즘", "b": "황혼"}, "shower": {"a": "오로라", "b": "궤도 수정"}}};
const FN = Object.fromEntries(NAMES.f.map(x => [x[0], x])), SN = Object.fromEntries(NAMES.s.map(x => [x[0], x]));
const TIER = { n:'일반', r:'희귀', e:'영웅', m:'신화', l:'전설', t:'초월' };
const $ = id => document.getElementById(id), qs = new URLSearchParams(location.search);
const fnm = id => FN[id] ? FN[id][1] + ' ' + FN[id][2] : id, snm = id => SN[id] ? SN[id][1] + ' ' + SN[id][2] : id;
const evn = (sid, k) => k ? ((NAMES.evo[sid] || {})[k] || ('진화 ' + k)) : '진화 없음';
const pct = v => (v*100).toFixed(1) + '%', num = v => Math.round(v).toLocaleString('ko-KR');
const CACHE_KEY = 'abstats_cache', TTL = 15*60*1000;
let ALL = [], reads = 0, fromCache = false, tab = 'skill', sortKey = {}, loadedAt = 0;

/* ───── 데이터 불러오기 (일반 모드: Firestore, ?demo=1: 가짜 데이터) ───── */
async function fetchRecords(limit, force) {
  if (qs.get('demo')) return demoData();
  try { const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); if (!force && c && c.limit === limit && Date.now() - c.at < TTL) { fromCache = true; loadedAt = c.at; return c.rows; } } catch (e) {}
  const base = 'https://www.gstatic.com/firebasejs/10.14.1/';
  const [app, au, fs] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
  const fapp = app.initializeApp(window.FIREBASE_CONFIG), auth = au.getAuth(fapp), db = fs.getFirestore(fapp);
  if (!auth.currentUser) await au.signInAnonymously(auth);
  const snap = await fs.getDocs(fs.query(fs.collection(db, 'battles'), fs.orderBy('srv', 'desc'), fs.limit(limit)));
  reads = snap.size; fromCache = false; loadedAt = Date.now();
  const rows = snap.docs.map(d => { const x = d.data(); x.srv = x.srv && x.srv.toMillis ? x.srv.toMillis() : (x.at || 0); return x; });
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ at:loadedAt, limit, rows })); } catch (e) {}
  return rows;
}
function demoData() {
  const out = [], fs = NAMES.f.map(x => x[0]), ss = NAMES.s.map(x => x[0]), R = (a) => a[Math.floor(Math.random()*a.length)];
  const deck = () => ({ f:{ id:R(fs), lv:1 + Math.floor(Math.random()*20) }, s:[0,1,2].map(() => { const id = R(ss); return { id, lv:1 + Math.floor(Math.random()*15), evo:R([null,'a','b']), scd:2 }; }) });
  for (let i = 0; i < 600; i++) {
    const a = Math.random() < 0.4, me = deck(), att = {}; me.s.forEach(s => { att[s.id] = [Math.round(Math.random()*5000), Math.round(Math.random()*500), 0]; }); att.basic = [Math.round(Math.random()*8000), 0, 0];
    const r = { t:a?'a':'s', stage:a?0:1 + Math.floor(Math.random()*30), win:Math.random() < 0.55, dur:20 + Math.floor(Math.random()*90), w:a?1:R([1,1,10]), ver:R(['3-30','3-31']), me, att, dbg:Math.random() < 0.05, at:Date.now() - i*600000, srv:Date.now() - i*600000 };
    if (a) { r.opp = deck(); r.oatt = {}; r.pw = [400 + Math.round(Math.random()*600), 400 + Math.round(Math.random()*600)]; }
    out.push(r);
  }
  return out;
}

/* ───── 집계 ───── */
function view() {
  const ver = $('fVer').value, mode = $('fMode').value, dbg = $('fDbg').checked;
  return ALL.filter(r => (!dbg || !r.dbg) && (ver === 'all' || r.ver === ver) && (mode === 'all' || r.t === mode));
}
/* 한 전투에서 '덱' 표본을 뽑는다 (아레나는 양쪽 덱, 스테이지는 내 덱) */
function samples(rows) {
  const out = [];
  for (const r of rows) {
    if (!r.me || !r.me.f) continue;
    out.push({ deck:r.me, win:r.win, att:r.att || {}, w:r.w || 1, t:r.t, dur:r.dur });
    if (r.t === 'a' && r.opp && r.opp.f) out.push({ deck:r.opp, win:!r.win, att:r.oatt || {}, w:r.w || 1, t:r.t, dur:r.dur });
  }
  return out;
}
const sumAtt = (att, k) => att && att[k] ? att[k][0] : 0;
const totAtt = att => Object.values(att || {}).reduce((a, v) => a + (v[0] || 0), 0);

function sortedRows(name, rows, defKey) {
  const k = sortKey[name] || { key:defKey, dir:-1 };
  return rows.slice().sort((a, b) => (typeof a[k.key] === 'string' ? a[k.key].localeCompare(b[k.key]) : a[k.key] - b[k.key])*k.dir);
}
function table(name, cols, rows, defKey) {
  const min = +$('fMin').value || 1, list = sortedRows(name, rows, defKey);
  if (!list.length) return '<div class="empty">표시할 기록이 없어요</div>';
  const head = cols.map(c => `<th data-s="${name}:${c.key}">${c.label}${(sortKey[name] || { key:defKey }).key === c.key ? ((sortKey[name] || { dir:-1 }).dir < 0 ? ' ▼' : ' ▲') : ''}</th>`).join('');
  const body = list.map(r => `<tr class="${r.n < min ? 'low' : ''}">${cols.map(c => `<td class="${c.key === 'name' ? 'nm' : ''}">${c.fmt ? c.fmt(r) : r[c.key]}</td>`).join('')}</tr>`).join('');
  return `<div class="tw"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
const winBar = r => `<div class="bar"><i style="width:${Math.min(100, r.rate*100)}%"></i><span class="${r.rate >= 0.5 ? 'win' : 'lose'}">${pct(r.rate)}</span></div>`;
const pickBar = r => `<div class="bar"><i style="width:${Math.min(100, r.pick*100*2)}%"></i><span>${pct(r.pick)}</span></div>`;

function aggFighters(rows) {
  const S = samples(rows), tot = S.reduce((a, s) => a + s.w, 0), m = {};
  for (const s of S) { const id = s.deck.f.id, o = m[id] || (m[id] = { id, name:fnm(id), tier:TIER[(FN[id] || [])[3]] || '', n:0, win:0, lv:0, dmg:0, dur:0 }); o.n += s.w; o.win += s.w*(s.win ? 1 : 0); o.lv += s.w*s.deck.f.lv; o.dmg += s.w*totAtt(s.att); o.dur += s.w*(s.dur || 0); }
  return Object.values(m).map(o => ({ ...o, rate:o.win/o.n, pick:o.n/(tot || 1), avgLv:o.lv/o.n, avgDmg:o.dmg/o.n, avgDur:o.dur/o.n }));
}
function aggSkills(rows) {
  const S = samples(rows), tot = S.reduce((a, s) => a + s.w, 0), m = {}, ev = {};
  for (const s of S) for (const k of s.deck.s) {
    if (!k) continue;
    const o = m[k.id] || (m[k.id] = { id:k.id, name:snm(k.id), tier:TIER[(SN[k.id] || [])[3]] || '', n:0, win:0, lv:0, dmg:0, heal:0 });
    o.n += s.w; o.win += s.w*(s.win ? 1 : 0); o.lv += s.w*k.lv; o.dmg += s.w*sumAtt(s.att, k.id); const a = s.att[k.id]; if (a) o.heal += s.w*((a[1] || 0) + (a[2] || 0));
    const ek = k.id + ':' + (k.evo || ''), e = ev[ek] || (ev[ek] = { sid:k.id, key:k.evo || '', n:0, win:0 }); e.n += s.w; e.win += s.w*(s.win ? 1 : 0);
  }
  return { list:Object.values(m).map(o => ({ ...o, rate:o.win/o.n, pick:o.n/(tot || 1), avgLv:o.lv/o.n, avgDmg:o.dmg/o.n, avgHeal:o.heal/o.n })), evo:Object.values(ev) };
}

/* ───── 탭 ───── */
const TABS = [['skill', '스킬'], ['fighter', '파이터'], ['stage', '스테이지'], ['arena', '아레나'], ['log', '전투 기록']];
function kpis(rows) {
  const w = rows.reduce((a, r) => a + (r.w || 1), 0), wins = rows.reduce((a, r) => a + (r.w || 1)*(r.win ? 1 : 0), 0), dur = rows.reduce((a, r) => a + (r.w || 1)*(r.dur || 0), 0);
  return `<div class="kpis"><div class="kpi"><b>${num(rows.length)}</b><span>기록 수</span></div><div class="kpi"><b>${w ? pct(wins/w) : '-'}</b><span>승률 (가중)</span></div><div class="kpi"><b>${w ? Math.round(dur/w) + '초' : '-'}</b><span>평균 전투 시간</span></div></div>`;
}
const TV = {
  skill(rows) {
    const a = aggSkills(rows), cols = [
      { key:'name', label:'스킬' }, { key:'tier', label:'등급' }, { key:'n', label:'표본', fmt:r => num(r.n) },
      { key:'rate', label:'승률', fmt:winBar }, { key:'pick', label:'채택률', fmt:pickBar }, { key:'avgLv', label:'평균 Lv', fmt:r => r.avgLv.toFixed(1) },
      { key:'avgDmg', label:'평균 피해', fmt:r => num(r.avgDmg) }, { key:'avgHeal', label:'평균 회복·보호', fmt:r => num(r.avgHeal) } ];
    const evRows = a.evo.map(e => ({ name:snm(e.sid) + ' · ' + evn(e.sid, e.key), n:e.n, rate:e.win/e.n })).sort((x, y) => x.name.localeCompare(y.name));
    return `<div class="card">${kpis(rows)}</div><div class="card"><h2>스킬별 승률</h2>${table('skill', cols, a.list, 'n')}<div class="note">채택률은 전체 덱 중 해당 스킬을 낀 비율이에요. 피해는 그 스킬을 낀 전투의 평균이에요. 아레나는 양쪽 덱을 모두 표본으로 세요.</div></div>
      <div class="card"><h2>진화별 승률</h2>${table('evo', [{ key:'name', label:'스킬 · 진화' }, { key:'n', label:'표본', fmt:r => num(r.n) }, { key:'rate', label:'승률', fmt:winBar }], evRows, 'n')}</div>`;
  },
  fighter(rows) {
    const list = aggFighters(rows), cols = [
      { key:'name', label:'파이터' }, { key:'tier', label:'등급' }, { key:'n', label:'표본', fmt:r => num(r.n) }, { key:'rate', label:'승률', fmt:winBar }, { key:'pick', label:'채택률', fmt:pickBar },
      { key:'avgLv', label:'평균 Lv', fmt:r => r.avgLv.toFixed(1) }, { key:'avgDmg', label:'평균 총 피해', fmt:r => num(r.avgDmg) }, { key:'avgDur', label:'평균 시간', fmt:r => Math.round(r.avgDur) + '초' } ];
    return `<div class="card">${kpis(rows)}</div><div class="card"><h2>파이터별 승률</h2>${table('fighter', cols, list, 'n')}</div>`;
  },
  stage(rows) {
    rows = rows.filter(r => r.t === 's'); const m = {};
    for (const r of rows) { const o = m[r.stage] || (m[r.stage] = { stage:r.stage, name:'STAGE ' + r.stage, n:0, win:0, dur:0, cnt:0, f:{} }); const w = r.w || 1; o.n += w; o.win += w*(r.win ? 1 : 0); o.dur += w*(r.dur || 0); o.cnt++; if (r.me && r.me.f) o.f[r.me.f.id] = (o.f[r.me.f.id] || 0) + w; }
    const list = Object.values(m).map(o => ({ ...o, rate:o.win/o.n, avgDur:o.dur/o.n, top:fnm(Object.entries(o.f).sort((a, b) => b[1] - a[1])[0][0]) }));
    const cols = [{ key:'stage', label:'스테이지', fmt:r => r.name }, { key:'n', label:'시도(가중)', fmt:r => num(r.n) }, { key:'rate', label:'클리어율', fmt:winBar }, { key:'avgDur', label:'평균 시간', fmt:r => Math.round(r.avgDur) + '초' }, { key:'top', label:'많이 쓴 파이터' }];
    return `<div class="card">${kpis(rows)}</div><div class="card"><h2>스테이지별 클리어율</h2>${table('stage', cols, list, 'stage')}<div class="note">반복 전투는 10%만 기록해 가중치를 곱해 계산해요. 현재 도전 중인 스테이지의 승률이 가장 정확해요.</div></div>`;
  },
  arena(rows) {
    rows = rows.filter(r => r.t === 'a'); const B = [['-30% 이하', -9, -0.3], ['-30~-10%', -0.3, -0.1], ['±10%', -0.1, 0.1], ['+10~+30%', 0.1, 0.3], ['+30% 이상', 0.3, 9]], pb = B.map(b => ({ name:b[0], lo:b[1], hi:b[2], n:0, win:0 }));
    const pairs = {};
    for (const r of rows) {
      if (r.pw && r.pw[1] > 0) { const d = (r.pw[0] - r.pw[1])/r.pw[1], b = pb.find(x => d >= x.lo && d < x.hi) || pb[pb.length - 1]; b.n++; b.win += r.win ? 1 : 0; }
      if (r.me && r.opp && r.me.f && r.opp.f) { const k = r.me.f.id + '>' + r.opp.f.id, o = pairs[k] || (pairs[k] = { name:fnm(r.me.f.id) + '  vs  ' + fnm(r.opp.f.id), n:0, win:0 }); o.n++; o.win += r.win ? 1 : 0; }
    }
    const pl = pb.map(b => ({ ...b, rate:b.n ? b.win/b.n : 0 })), pr = Object.values(pairs).map(o => ({ ...o, rate:o.win/o.n }));
    return `<div class="card">${kpis(rows)}</div>
      <div class="card"><h2>전투력 차이별 승률 <span class="tag">내 전투력 기준</span></h2>${table('pw', [{ key:'name', label:'상대 대비' }, { key:'n', label:'표본', fmt:r => num(r.n) }, { key:'rate', label:'승률', fmt:winBar }], pl, 'name')}</div>
      <div class="card"><h2>파이터 상성 <span class="tag">내 파이터 vs 상대</span></h2>${table('pair', [{ key:'name', label:'매치업' }, { key:'n', label:'표본', fmt:r => num(r.n) }, { key:'rate', label:'승률', fmt:winBar }], pr, 'n')}</div>
      <div class="note">아레나의 파이터·스킬별 승률은 '스킬', '파이터' 탭에서 모드를 아레나로 바꿔 보세요.</div>`;
  },
  log(rows) {
    const list = rows.slice().sort((a, b) => (b.srv || b.at) - (a.srv || a.at)).slice(0, 100);
    const dk = d => d ? `${FN[d.f.id] ? FN[d.f.id][1] : '?'} <span style="color:var(--ink3)">Lv${d.f.lv}</span> ` + d.s.filter(Boolean).map(k => `${SN[k.id] ? SN[k.id][1] : '?'}${k.evo ? '<sup>' + (k.evo === 'a' ? '1' : '2') + '</sup>' : ''}`).join(' ') : '';
    const body = list.map(r => { const t = new Date(r.srv || r.at); return `<tr><td>${t.toLocaleString('ko-KR', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' })}</td><td>${r.t === 'a' ? '아레나' : 'STAGE ' + r.stage}</td><td class="${r.win ? 'win' : 'lose'}">${r.win ? '승리' : '패배'}</td><td>${r.dur || 0}초</td><td class="deck">${dk(r.me)}</td><td class="deck">${r.opp ? dk(r.opp) : '-'}</td><td>${r.ver}</td></tr>`; }).join('');
    return `<div class="card"><h2>최근 전투 100건</h2>${list.length ? `<div class="tw"><table><thead><tr><th style="cursor:default">시각</th><th style="cursor:default">종류</th><th style="cursor:default">결과</th><th style="cursor:default">시간</th><th style="cursor:default">내 덱</th><th style="cursor:default">상대 덱</th><th style="cursor:default">버전</th></tr></thead><tbody>${body}</tbody></table></div>` : '<div class="empty">기록이 없어요</div>'}</div>`;
  }
};
function render() {
  $('tabs').innerHTML = TABS.map(t => `<button class="tab ${tab === t[0] ? 'on' : ''}" data-t="${t[0]}">${t[1]}</button>`).join('');
  $('view').innerHTML = TV[tab](view());
}
function fillVersions() {
  const vs = [...new Set(ALL.map(r => r.ver))].sort().reverse(), cur = $('fVer').value;
  $('fVer').innerHTML = '<option value="all">모든 버전</option>' + vs.map(v => `<option>${v}</option>`).join('');
  $('fVer').value = vs.includes(cur) ? cur : (vs[0] || 'all');
}
async function load(force) {
  $('meta').textContent = '불러오는 중…'; 
  try {
    const limit = +$('fLimit').value; ALL = await fetchRecords(limit, force);
    fillVersions();
    $('meta').textContent = `최근 기록 ${num(ALL.length)}건 · ${new Date(loadedAt || Date.now()).toLocaleString('ko-KR')} 기준${qs.get('demo') ? ' · 데모 데이터' : ''}`;
    $('readNote').textContent = fromCache ? '캐시된 결과예요(15분). 읽기 한도를 쓰지 않았어요. 새로고침을 누르면 다시 읽어요.' : (qs.get('demo') ? '' : `Firestore에서 ${num(reads)}건을 읽었어요 (하루 무료 한도 50,000건).`);
    render();
  } catch (e) { $('meta').textContent = '불러오지 못했어요'; $('view').innerHTML = `<div class="card"><div class="empty">${String(e.code || e.message || e)}<br><span style="font-weight:500;font-size:12px">firestore.rules에서 battles 읽기를 열었는지 확인해 주세요.</span></div></div>`; }
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-t]'); if (t) { tab = t.dataset.t; render(); return; }
  const h = e.target.closest('th[data-s]'); if (h) { const [n, k] = h.dataset.s.split(':'), c = sortKey[n]; sortKey[n] = { key:k, dir:c && c.key === k ? -c.dir : (k === 'name' ? 1 : -1) }; render(); }
});
for (const id of ['fVer', 'fMode', 'fMin', 'fDbg']) $(id).addEventListener('input', render);
$('fLimit').addEventListener('change', () => load(true)); $('reload').addEventListener('click', () => load(true));
load(false);
</script>
</body>
