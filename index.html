<title>애니멀 브롤 통계</title>

<style>
:root{
  --bg:#f3f5f8;--surface:#fff;--ink:#121b27;--ink2:#4a5666;--ink3:#8592a3;--line:#e5e9ef;--soft:#f6f8fb;

}
@media (prefers-color-scheme:dark){:root{
  --bg:#0c1118;--surface:#141b25;--ink:#edf1f7;--ink2:#aab5c4;--ink3:#6b7889;--line:#232e3d;--soft:#1a2330;
  --brand:#7aa5ff;--brandSoft:#1b2a4a;--good:#3ccf9f;--goodSoft:#12372e;--bad:#ff7a80;--badSoft:#3d1c20;--mid:#3a4658;

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 'Pretendard',-apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px 72px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:28px 0 18px;flex-wrap:wrap}
.top h1{margin:0;font-size:26px;line-height:1.2;font-weight:800;letter-spacing:-.035em}
.top p{margin:6px 0 0;font-size:13px;color:var(--ink3)}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:34px;padding:0 12px;font-weight:600;font-size:13px;color:var(--ink2);cursor:pointer}
.ghost:hover{border-color:var(--mid)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-bottom:14px}
.seg{display:inline-flex;background:var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;border-radius:8px;height:30px;padding:0 14px;font-weight:700;font-size:13px;color:var(--ink2);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(18,27,39,.12)}
select,.num{height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 10px;font-weight:600;font-size:13px}
.fld{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);font-weight:600}
.num{width:64px}
details.more{position:relative;margin-left:auto}
details.more summary{list-style:none;cursor:pointer}
details.more summary::-webkit-details-marker{display:none}
.pop{position:absolute;right:0;top:40px;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:240px;box-shadow:0 12px 32px rgba(18,27,39,.16);display:grid;gap:12px}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:0;background:var(--bg);z-index:10}
.tab{border:0;background:none;padding:12px 14px;font-weight:700;font-size:15px;color:var(--ink3);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink)}
.sheet{background:var(--surface);border-radius:20px;margin-top:16px;overflow:hidden}
.sec{padding:22px 22px 24px}
.sec+.sec{border-top:1px solid var(--line)}
.sec h2{margin:0;font-size:18px;font-weight:800;letter-spacing:-.025em}
.sec .d{margin:4px 0 16px;font-size:13px;color:var(--ink3);max-width:62ch}
.glance{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0}
.glance>div{padding:18px 22px;border-right:1px solid var(--line)}

.glance b{display:block;font-size:17px;font-weight:800;margin-top:2px;letter-spacing:-.02em}
.glance span{font-size:13px;font-weight:700}
.up{color:var(--good)}.down{color:var(--bad)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}

.chip[aria-pressed=true]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.search{height:30px;border:1px solid var(--line);border-radius:99px;padding:0 12px;background:var(--surface);min-width:140px;font-size:13px}
.tw{overflow-x:auto;margin:0 -22px;padding:0 22px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-weight:700;color:var(--ink3);text-align:right;padding:8px 10px;white-space:nowrap;cursor:pointer;user-select:none;font-size:12.5px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;padding-left:0}

tr:last-child td{border-bottom:0}
td.nm{font-weight:700;color:var(--ink)}
tr.low td{opacity:.4}
.tier{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:middle}
.rate{display:inline-flex;align-items:center;gap:10px;justify-content:flex-end}
.rate b{min-width:48px;text-align:right;font-weight:800}
.pk{display:inline-flex;align-items:center;gap:8px;justify-content:flex-end}
.pk i{display:block;height:6px;border-radius:3px;background:var(--mid)}
.pk b{min-width:42px;text-align:right;font-weight:700;color:var(--ink2)}
svg text{font-family:inherit}
.mapw{overflow-x:auto;margin:0 -4px;padding:0 4px}
.map{width:100%;min-width:600px;height:auto;display:block;touch-action:manipulation}
.map .dot{cursor:pointer}
.cap{min-height:44px;margin-top:10px;padding:10px 14px;background:var(--soft);border-radius:12px;font-size:13px;color:var(--ink2);font-weight:600}
.cap b{color:var(--ink);font-weight:800}
.empty{padding:56px 22px;text-align:center}
.empty b{display:block;font-size:16px;font-weight:800}
.empty p{margin:6px auto 0;color:var(--ink3);max-width:44ch}
.note{font-size:12px;color:var(--ink3);line-height:1.65;margin-top:14px;max-width:70ch}
.foot{margin-top:22px;font-size:12px;color:var(--ink3);line-height:1.7;text-align:center}
.deck{font-size:15px}
.deck small{font-size:11px;color:var(--ink3);font-weight:600;margin:0 4px 0 2px}
.dtl td{background:var(--soft);white-space:normal;text-align:left;padding:12px 14px}
.dtl .g{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px}
tr.clk{cursor:pointer}
tr.clk:hover td{background:var(--soft)}
.sk{display:flex;gap:12px;align-items:center}
.sk i{flex:1;height:14px;border-radius:7px;background:var(--line)}

</style>
</head>

    const body = list.map((r, i) => { const t = new Date(r.srv || r.at); return `<tr class="clk" data-o="${i}"><td>${t.toLocaleString('ko-KR', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' })}</td><td>${r.t === 'a' ? '아레나' : 'STAGE ' + r.stage}</td><td class="${r.win ? 'up' : 'down'}">${r.win ? '승리' : '패배'}</td><td>${r.dur || 0}초</td><td style="text-align:left">${dk(r.me)}</td><td style="text-align:left">${r.opp ? dk(r.opp) : ''}</td><td style="color:var(--ink3)">${r.ver}</td></tr>${open === i ? `<tr class="dtl"><td colspan="7">${detail(r, true)}${r.opp ? detail(r, false) : ''}${r.pw ? `<div class="note" style="margin-top:8px">전투력 ${num(r.pw[0])} vs ${num(r.pw[1])}</div>` : ''}</td></tr>` : ''}`; }).join('');
    return glance(kpis(rows)) + `<div class="sheet"><div class="sec"><h2>최근 전투 100건</h2><p class="d">줄을 누르면 스킬별 피해와 회복을 볼 수 있어요.</p>${list.length ? `<div class="tw"><table><thead><tr>${['시각', '종류', '결과', '시간', '내 덱', '상대 덱', '버전'].map(h => `<th style="cursor:default;${h === '내 덱' || h === '상대 덱' ? 'text-align:left' : ''}">${h}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>` : ''}</div></div>`;
  }
};
function emptyHtml() { return `<div class="sheet"><div class="empty"><b>아직 보여 줄 기록이 없어요</b><p>게임 3-31 이상에서 전투를 몇 번 하면 1분 안에 기록이 올라와요. 버전이나 종류 필터가 좁게 걸려 있지 않은지도 확인해 보세요.</p></div></div>`; }
function render() {
  $('tabs').innerHTML = TABS.map(t => `<button class="tab" role="tab" type="button" data-t="${t[0]}" aria-selected="${tab === t[0]}">${t[1]}</button>`).join('');
  const rows = view();
  if (!rows.length) { $('view').innerHTML = emptyHtml(); return; }
  const f = document.activeElement && document.activeElement.id === 'q' ? document.activeElement.selectionStart : null;
  $('view').innerHTML = TV[tab](rows);
  if (f !== null && $('q')) { $('q').focus(); $('q').setSelectionRange(f, f); }
}
function skeleton() { $('view').innerHTML = `<div class="sheet"><div class="sec">${'<div class="sk" style="margin-bottom:14px"><i></i><i></i><i></i></div>'.repeat(6)}</div></div>`; }
function fillVersions() { const vs = [...new Set(ALL.map(r => r.ver))].sort().reverse(), cur = $('fVer').value; $('fVer').innerHTML = '<option value="all">모든 버전</option>' + vs.map(v => `<option>${v}</option>`).join(''); $('fVer').value = vs.includes(cur) ? cur : (vs[0] || 'all'); }
async function load(force) {
  $('meta').textContent = '불러오는 중'; skeleton();
  try {
    ALL = await fetchRecords(+$('fLimit').value, force); fillVersions();
    const t = new Date(loadedAt || Date.now());
    $('meta').textContent = `최근 기록 ${num(ALL.length)}건 · ${t.toLocaleString('ko-KR', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' })} 기준${qs.get('demo') ? ' · 데모 데이터' : ''}`;
    $('readNote').textContent = qs.get('demo') ? '' : (fromCache ? '캐시된 결과를 보고 있어요(15분). 읽기 한도를 쓰지 않았어요.' : `Firestore에서 ${num(reads)}건을 읽었어요. 하루 무료 한도는 50,000건이에요.`);
    render();
  } catch (e) {
    $('meta').textContent = '불러오지 못했어요';
    $('view').innerHTML = `<div class="sheet"><div class="empty"><b>기록을 읽지 못했어요</b><p>${String(e.code || e.message || e)}<br>firestore.rules에서 battles 읽기가 열려 있는지, Authentication의 승인된 도메인에 이 사이트 주소가 있는지 확인해 주세요.</p></div></div>`;
  }
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-t]'); if (t) { tab = t.dataset.t; open = -1; render(); return; }
  const h = e.target.closest('th[data-s]'); if (h) { const [n, k] = h.dataset.s.split(':'), c = sortKey[n]; sortKey[n] = { key:k, dir:c && c.key === k ? -c.dir : (k === 'name' ? 1 : -1) }; render(); return; }
  const m = e.target.closest('#fMode button'); if (m) { mode = m.dataset.v; document.querySelectorAll('#fMode button').forEach(b => b.setAttribute('aria-pressed', b === m)); open = -1; render(); return; }
  const c = e.target.closest('[data-tier]'); if (c) { tierF = c.dataset.tier; render(); return; }
  const r = e.target.closest('tr[data-o]'); if (r) { const i = +r.dataset.o; open = open === i ? -1 : i; render(); return; }
  const d = e.target.closest('.dot'); if (d) showDot(d.dataset.i);
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('dot')) { e.preventDefault(); showDot(e.target.dataset.i); } });
function showDot(id) {
  const rows = view(), l = tab === 'skill' ? aggSkills(rows).list : aggFighters(rows), o = l.find(x => x.id === id), cap = $('cap'); if (!o || !cap) return;
  cap.innerHTML = `<b>${o.name}</b> · 승률 <b class="${rateCls(o.rate)}">${pct(o.rate)}</b> (${pct(o.ci[0], 0)}~${pct(o.ci[1], 0)}) · 채택률 <b>${pct(o.pick)}</b> · 표본 <b>${num(o.cnt)}</b>건 · 평균 Lv <b>${o.avgLv.toFixed(1)}</b>`;
}
document.addEventListener('input', e => { if (e.target.id === 'q') { q = e.target.value.trim(); render(); } });
for (const id of ['fVer', 'fMin', 'fDbg']) $(id).addEventListener('input', () => { open = -1; render(); });
$('fLimit').addEventListener('change', () => load(true)); $('reload').addEventListener('click', () => load(true));
load(false);
</script>
</body>
